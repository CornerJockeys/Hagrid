name = "hagrid"
main = "src/index.ts"
compatibility_date = "2026-09-30"

[triggers]
crons = ["0 17 * * 1", "0 18 * * 1"]

[assets]
directory = "./activity/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/interactions", "/health"]

[[d1_databases]]
binding = "DB"
database_name = "hagrid"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"
